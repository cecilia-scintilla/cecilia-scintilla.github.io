# 首页模块清单：想加板块/平台就改这里，index.md 会自动渲染
# category = _layouts/category.html（该分类下所有文章）
# module   = _layouts/module.html（某个平台/系列的文章，用 platform 字段匹配）

- title: "CTF Writeups"
  desc: "按平台整理题目与解题记录"
