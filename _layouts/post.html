---
layout: default
---
<!-- 这里模仿你首页的头部背景 -->
<div class="site-header" style="background-image: url('/bg.jpg'); background-size: cover; background-position: center; padding: 100px 0; text-align: center; color: white;">
  <h1 class="post-title" style="font-size: 2.5em; font-weight: bold;">{{ page.title }}</h1>
  <p class="post-meta" style="margin-top: 10px;">{{ page.date | date: "%Y-%m-%d" }}</p >
</div>

<!-- 下面是文章正文内容 -->
<div class="post-content" style="max-width: 800px; margin: 0 auto; padding: 20px;">
  {{ content }}
</div>
