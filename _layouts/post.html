---
layout: default
---

<style>
  /* 只隐藏主题自带的蓝绿色头部，不要隐藏你自己的 */
  .page-header {
    display: none !important;
  }
</style>

<!-- 这里修改了class名称，避免冲突 -->
<div class="custom-post-header" style="background-image: url('/bg.jpg'); background-size: cover; background-position: center; padding: 100px 0; text-align: center; color: white;">
  <h1>{{ page.title }}</h1>
  <p>{{ page.date | date: "%Y-%m-%d" }}</p >
</div>

<!-- 文章正文 -->
<div style="max-width: 800px; margin: 0 auto; padding: 20px;">
  {{ content }}
</div>
